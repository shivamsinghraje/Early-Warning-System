spring.application.name=EarlyWarningSystem

# src/main/resources/application.properties
# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ews_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Storage Configuration
storage.path=./storage

# Python ML Service
python.ml.service.url=http://localhost:8001

# Logging
logging.level.com.ews=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN




# Add this line to application.properties
spring.security.user.name=disabled
spring.security.user.password=disabled
logging.level.org.springframework.security=ERROR