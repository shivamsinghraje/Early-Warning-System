# docker-compose.yml
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ews-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ews_db
      MYSQL_USER: ews_user
      MYSQL_PASSWORD: ews_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ews-network

  spring-backend:
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    container_name: ews-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ews_db
      SPRING_DATASOURCE_USERNAME: ews_user
      SPRING_DATASOURCE_PASSWORD: ews_password
      PYTHON_ML_SERVICE_URL: http://python-ml:8001
    depends_on:
      - mysql
      - python-ml
    volumes:
      - ./storage:/app/storage
    networks:
      - ews-network

  python-ml:
    build:
      context: ./python-ml
      dockerfile: Dockerfile
    container_name: ews-ml
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/app/storage
    networks:
      - ews-network

  frontend:
    image: nginx:alpine
    container_name: ews-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - spring-backend
    networks:
      - ews-network

volumes:
  mysql_data:

networks:
  ews-network:
    driver: bridge